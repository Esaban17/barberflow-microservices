# ─────────────────────────────────────────────────────────────────────────────
# BarberFlow — compose base: red compartida + Consul.
# Los demás servicios se agregan en las tareas 13, 18, 22, 28 y 36 del backlog.
#
# MAPA DE PUERTOS
# El puerto interno (el que escucha el proceso dentro del contenedor) es fijo y
# es el del PDF del curso. El puerto del host es overridable por variable de
# entorno, porque en la máquina de desarrollo 8001 y 5432 ya están ocupados.
# Las variables se definen en .env (copiar de .env.example).
#
#   Servicio             Interno   Host (override)              Tarea
#   ───────────────────────────────────────────────────────────────────
#   barberflow-mcp        8000     ${MCP_PORT:-8000}              28
#   booking-svc           8001     ${BOOKING_PORT:-8001}          18
#   notif-svc             8002     ${NOTIF_PORT:-8002}            22
#   users-svc             8003     ${USERS_PORT:-8003}            13
#   consul                8500     ${CONSUL_PORT:-8500}            4
#   orchestrator          9000     ${ORCHESTRATOR_PORT:-9000}     36
#   booking-agent         9001     ${BOOKING_AGENT_PORT:-9001}    36
#   notification-agent    9002     ${NOTIFICATION_AGENT_PORT:-9002}  36
#
# Bases de datos (users-db, booking-db, notif-db): escuchan en 5432 dentro de la
# red `barberflow` y NO publican puerto al host. Solo sus servicios las alcanzan,
# por nombre de contenedor. Para inspeccionarlas: `docker compose exec <db> psql`.
#
# Ojo: en la máquina de desarrollo 8001 ya lo ocupa otro contenedor, así que el
# .env local debe sobrescribir BOOKING_PORT (p. ej. 8011) antes de levantar
# booking-svc. 5432 también está ocupado, pero como las BD no publican puerto no
# hace falta override.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # Red bridge única: todos los servicios se resuelven entre sí por nombre.
  barberflow:
    driver: bridge

services:
  # Service registry. `-dev` mantiene el estado en memoria: suficiente para la
  # demo del curso y evita tener que versionar un volumen.
  consul:
    image: hashicorp/consul:1.17
    container_name: barberflow-consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "${CONSUL_PORT:-8500}:8500"
    networks:
      - barberflow
    healthcheck:
      # Le pregunta al propio agente; si el binario responde, el catálogo está arriba.
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
